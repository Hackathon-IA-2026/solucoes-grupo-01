AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Infraestrutura serverless da POC CurtaiLess

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z0-9-]+$"

  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-opus-5
  BedrockFallbackModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-5
  BedrockEmergencyModelId:
    Type: String
    Default: us.amazon.nova-pro-v1:0
  BedrockKnowledgeBaseId:
    Type: String
    Default: pending
  OnsSourceBucket:
    Type: String
    Default: ons-aws-prod-opendata
  OnsSourceDataset:
    Type: String
    Default: restricao_coff_eolica_tm
  OnsSourcePrefix:
    Type: String
    Default: dataset/restricao_coff_eolica_tm/

Globals:
  Function:
    Architectures:
      - x86_64
    MemorySize: 2048
    Timeout: 60
    Tracing: Active

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src.curtailess.main.handler
      Runtime: python3.12
      Description: API FastAPI da plataforma CurtaiLess
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          APP_ENV: !Ref StageName
          API_GATEWAY_BASE_PATH: !Sub /${StageName}
          CORS_ORIGINS: !Sub http://${FrontendBucket}.s3-website-${AWS::Region}.${AWS::URLSuffix}
          DATA_BUCKET: !Ref DataBucket
          SCENARIOS_TABLE: !Ref ScenariosTable
          EXPOSURE_TABLE: !Ref ExposureTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_FALLBACK_MODEL_ID: !Ref BedrockFallbackModelId
          BEDROCK_EMERGENCY_MODEL_ID: !Ref BedrockEmergencyModelId
          BEDROCK_KNOWLEDGE_BASE_ID: !Ref BedrockKnowledgeBaseId
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ScenariosTable
        - DynamoDBReadPolicy:
            TableName: !Ref ExposureTable
        - S3WritePolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Sid: InvokeBedrockModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
            - Sid: RetrieveBedrockKnowledgeBase
              Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
            PayloadFormatVersion: "2.0"
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  IngestionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  IngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionDeadLetterQueue.Arn
        maxReceiveCount: 3

  IngestionLedgerTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: source_fingerprint
          AttributeType: S
      KeySchema:
        - AttributeName: source_fingerprint
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  IngestionDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src.curtailess.ingestion.discovery_handler
      Runtime: python3.12
      Description: Descobre objetos publicos ONS com backfill limitado e idempotente
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref OnsSourceBucket
          SOURCE_DATASET: !Ref OnsSourceDataset
          SOURCE_PREFIX: !Ref OnsSourcePrefix
          INGESTION_QUEUE_URL: !Ref IngestionQueue
          INGESTION_LEDGER_TABLE: !Ref IngestionLedgerTable
          INGESTION_LEASE_SECONDS: "300"
          DISCOVERY_MAX_MESSAGES: "100"
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt IngestionQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref IngestionLedgerTable
        - Statement:
            - Sid: ListPublicOnsDataset
              Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub arn:${AWS::Partition}:s3:::${OnsSourceBucket}
              Condition:
                StringLike:
                  s3:prefix:
                    - dataset/*
      Events:
        DailyOnsDiscovery:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 19 * * ? *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            State: DISABLED
            Description: Descoberta diaria ONS; habilitar apos validar idempotencia

  IngestionDiscoveryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${IngestionDiscoveryFunction}
      RetentionInDays: 14

  IngestionCopyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src.curtailess.ingestion.copy_handler
      Runtime: python3.12
      Description: Copia objeto ONS para raw e grava manifesto de proveniencia
      MemorySize: 1024
      Timeout: 300
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          MATERIALIZATION_FUNCTION: !Ref ExposureMaterializationFunction
          INGESTION_LEDGER_TABLE: !Ref IngestionLedgerTable
          INGESTION_LEASE_SECONDS: "300"
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref IngestionLedgerTable
        - Statement:
            - Sid: ReadPublicOnsDataset
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${OnsSourceBucket}/dataset/*
            - Sid: StartExposureMaterialization
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt ExposureMaterializationFunction.Arn
      Events:
        IngestionQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestionQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  IngestionCopyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${IngestionCopyFunction}
      RetentionInDays: 14

  ExposureMaterializationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src.curtailess.materialization.materialization_handler
      Runtime: python3.12
      Description: Valida e materializa exposicao mensal real do ONS
      MemorySize: 2048
      Timeout: 300
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          EXPOSURE_TABLE: !Ref ExposureTable
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ExposureTable

  ExposureMaterializationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ExposureMaterializationFunction}
      RetentionInDays: 14

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadStaticWebsite
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

  ScenariosTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: plant_id
          AttributeType: S
        - AttributeName: scenario_id
          AttributeType: S
      KeySchema:
        - AttributeName: plant_id
          KeyType: HASH
        - AttributeName: scenario_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ExposureTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: asset_id
          AttributeType: S
        - AttributeName: period
          AttributeType: S
      KeySchema:
        - AttributeName: asset_id
          KeyType: HASH
        - AttributeName: period
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

Outputs:
  ApiUrl:
    Description: URL publica da API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}
  DataBucketName:
    Description: Bucket de dados e artefatos
    Value: !Ref DataBucket
  FrontendBucketName:
    Description: Bucket do frontend SPA gerenciado pela stack
    Value: !Ref FrontendBucket
  FrontendWebsiteUrl:
    Description: URL publica do website S3
    Value: !Sub http://${FrontendBucket}.s3-website-${AWS::Region}.${AWS::URLSuffix}
  ScenariosTableName:
    Description: Tabela de planos e cenarios
    Value: !Ref ScenariosTable
  IngestionLedgerTableName:
    Description: Tabela de estado idempotente da ingestao
    Value: !Ref IngestionLedgerTable
  IngestionQueueUrl:
    Description: URL da fila privada de ingestao ONS
    Value: !Ref IngestionQueue
  IngestionDeadLetterQueueUrl:
    Description: URL da fila de mensagens com falha
    Value: !Ref IngestionDeadLetterQueue
  IngestionDiscoveryFunctionName:
    Description: Lambda de descoberta do dataset ONS
    Value: !Ref IngestionDiscoveryFunction
  IngestionCopyFunctionName:
    Description: Lambda de copia raw e manifesto
    Value: !Ref IngestionCopyFunction
  ExposureMaterializationFunctionName:
    Description: Lambda de validacao e materializacao mensal
    Value: !Ref ExposureMaterializationFunction
  ExposureTableName:
    Description: Tabela de exposicao mensal por ativo
    Value: !Ref ExposureTable
