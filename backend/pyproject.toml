[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curtailess-api"
version = "0.1.0"
description = "API da plataforma CurtaiLess"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.118,<1",
  "mangum>=0.19,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/curtailess"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
