/* CurtailLess, sistema de design v2. Direcao: grafite frio com sinal esmeralda.
   Implementa wireframe-v2/SISTEMA-DE-DESIGN.md. Nenhum token tem nome de cor.
   As @font-face entram no arquivo montado, com os arquivos empacotados em base64. */

:root {
  /* superficie */
  --superficie-base: #eceff3;
  --superficie-elevada: #f9fafb;
  --superficie-tinta: #10151a;
  --superficie-trilho: #dfe5ea;
  --superficie-realce: #e2e9f0;

  /* texto */
  --texto-forte: #10151a;
  --texto-corrente: #202730;
  --texto-apoio: #59636f;
  --texto-sobre-tinta: #eef1f4;

  /* borda e foco */
  --borda-sutil: #d2d9e0;
  --borda-forte: #77828f;
  --borda-foco: #10151a;

  /* dado com canal */
  --serie-canal-forte: #14664d;
  --serie-canal-fraco: #459477;

  /* dado sem canal */
  --serie-sem-canal: #6b7785;

  /* padroes, o canal 1 da codificacao */
  --hachura-sem-canal: repeating-linear-gradient(45deg,
    var(--serie-sem-canal) 0 1px, transparent 1px 7px);
  --hachura-lacuna: repeating-linear-gradient(45deg,
    var(--serie-sem-canal) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(135deg,
    var(--serie-sem-canal) 0 1px, transparent 1px 7px);
  --contorno-derivado: 1.5px dashed var(--serie-sem-canal);

  /* atencao, por inversao e nao por cor */
  --atencao-fundo: #10151a;
  --atencao-texto: #eef1f4;

  /* tipografia */
  --fonte-titulo: 'Archivo', system-ui, sans-serif;
  --fonte-corpo: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --peso-forte: 700;
  --peso-medio: 600;
  --peso-corpo: 400;
  --entrelinha-corpo: 1.6;
  --largura-leitura: 72ch;

  /* espaco, na escala de 4 */
  --esp-1: 4px;   --esp-2: 8px;   --esp-3: 12px;  --esp-4: 16px;
  --esp-5: 24px;  --esp-6: 32px;  --esp-7: 48px;

  /* forma */
  --raio-1: 3px;   --raio-2: 8px;
  --borda-1: 1px;  --borda-2: 2px;  --borda-3: 3px;

  /* elevacao */
  --sombra-1: 0 1px 2px rgba(16, 21, 26, 0.07);
  --sombra-2: 0 12px 32px rgba(16, 21, 26, 0.22);

  /* camadas */
  --z-conteudo: 0;   --z-flutuante: 10;  --z-casca: 20;
  --z-veu: 30;       --z-painel: 40;     --z-aviso: 50;

  /* casca */
  --altura-topo: 56px;
  --altura-rodape: 46px;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--superficie-base);
  color: var(--texto-corrente);
  font-family: var(--fonte-corpo);
  font-size: 16px;
  line-height: var(--entrelinha-corpo);
  font-variant-numeric: tabular-nums;
  font-weight: var(--peso-corpo);
}

h1, h2, h3 { font-family: var(--fonte-titulo); font-weight: var(--peso-forte); color: var(--texto-forte); margin: 0; }
h1 { font-size: 26px; line-height: 1.2; letter-spacing: -0.01em; }
h2 { font-size: 20px; line-height: 1.3; }
h3 { font-size: 16px; line-height: 1.3; }
p { margin: 0 0 var(--esp-2); max-width: var(--largura-leitura); }
a { color: var(--serie-canal-forte); }

:focus-visible { outline: var(--borda-2) solid var(--borda-foco); outline-offset: 2px; }

/* ---------- tipos de texto ---------- */

.rotulo {
  font-family: var(--fonte-titulo);
  font-weight: var(--peso-medio);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--texto-apoio);
}

.numero { font-family: var(--fonte-corpo); font-weight: var(--peso-medio); font-size: 32px; line-height: 1.1; color: var(--texto-forte); }
.nota { font-size: 12px; color: var(--texto-apoio); }
.compacto { font-size: 14px; line-height: 1.45; }
.forte { font-weight: var(--peso-medio); color: var(--texto-forte); }

/* ---------- casca ---------- */

.casca { min-height: 100vh; display: flex; flex-direction: column; }

.topo {
  height: var(--altura-topo);
  background: var(--superficie-tinta);
  color: var(--texto-sobre-tinta);
  display: flex; align-items: center; gap: var(--esp-5);
  padding: 0 var(--esp-5);
  position: sticky; top: 0; z-index: var(--z-casca);
}
.topo .marca { font-family: var(--fonte-titulo); font-weight: var(--peso-forte); font-size: 16px; letter-spacing: -0.01em; }
.topo .marca span { color: var(--serie-canal-fraco); }
.topo nav { display: flex; gap: var(--esp-4); margin-left: auto; align-items: center; }
.topo nav a, .topo nav button {

.conteudo { flex: 1; padding: var(--esp-7) var(--esp-5) calc(var(--esp-7) + var(--altura-rodape)); }

.faixa-versao {

.faixa-versao .separador { opacity: 0.4; }
.faixa-versao .cresce { margin-left: auto; }

/* ---------- aviso de dado sintetico ---------- */

.faixa-sintetica {

  border: var(--borda-1) solid var(--borda-forte);
  border-left: var(--borda-3) solid var(--serie-sem-canal);
  border-radius: var(--raio-2);
  padding: var(--esp-3) var(--esp-4);

.faixa-sintetica .texto { font-size: 14px; line-height: 1.45; max-width: var(--largura-leitura); }

/* ---------- lista de casos ---------- */

.cabecalho-tela { display: flex; align-items: flex-end; gap: var(--esp-4); margin-bottom: var(--esp-6); }
.cabecalho-tela .acao { margin-left: auto; }

.botao {
  font-family: var(--fonte-titulo); font-weight: var(--peso-medio); font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.06em;
  background: var(--superficie-tinta); color: var(--texto-sobre-tinta);
  border: 0; border-radius: var(--raio-1); padding: var(--esp-2) var(--esp-3); cursor: pointer;
}
.botao.vazio { background: var(--superficie-tinta); color: var(--texto-sobre-tinta); border: var(--borda-1) solid var(--superficie-tinta); }

/* a nota de apoio de um bloco, para nao se confundir com um item da lista acima */
.nota-bloco { background: var(--superficie-trilho); border-radius: var(--raio-2); padding: var(--esp-3); margin-top: var(--esp-2); }

.tabela { width: 100%; border-collapse: collapse; background: var(--superficie-elevada); border: var(--borda-1) solid var(--borda-sutil); border-radius: var(--raio-2); overflow: hidden; }
.tabela caption { text-align: left; padding: var(--esp-3) var(--esp-4) 0; }
.tabela th {
  font-family: var(--fonte-titulo); font-weight: var(--peso-medio); font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--texto-apoio);
  text-align: left; padding: var(--esp-3) var(--esp-3); border-bottom: var(--borda-1) solid var(--borda-forte);
  white-space: nowrap;
}
.tabela td { padding: var(--esp-2) var(--esp-3); border-bottom: var(--borda-1) solid var(--borda-sutil); vertical-align: top; }
.tabela tbody tr:hover { background: var(--superficie-realce); }
.tabela tbody tr.selecionado { background: var(--superficie-realce); }
.tabela tbody tr { cursor: pointer; }
.tabela .direita { text-align: right; }
.tabela .regua-grupo td { border-top: var(--borda-1) solid var(--borda-sutil); }
.tabela .fina td { padding: var(--esp-2) var(--esp-3); font-size: 14px; line-height: 1.45; }

/* a regua lateral de 3 px: diz "esta linha tem porta de reclamacao" sem gastar cor */
.linha-acionavel { border-left: var(--borda-3) solid var(--serie-canal-forte); }
.linha-sem-canal { border-left: var(--borda-3) solid var(--serie-sem-canal); }
.linha-acionavel td:first-child, .linha-sem-canal td:first-child { padding-left: var(--esp-3); }

/* ---------- selo de estado ---------- */

.selo {
  display: inline-flex; align-items: center; gap: var(--esp-1);
  font-family: var(--fonte-titulo); font-weight: var(--peso-medio); font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.06em;
  border-radius: var(--raio-1); padding: var(--esp-1) var(--esp-3);
  border: var(--borda-1) solid var(--borda-forte); color: var(--texto-forte);
  white-space: nowrap;
}
.selo.atencao { background: var(--atencao-fundo); color: var(--atencao-texto); border-color: var(--atencao-fundo); }
.selo.aberto { border-color: var(--borda-forte); }
.selo.consistencia { background: var(--hachura-sem-canal), var(--superficie-elevada); border-color: var(--serie-sem-canal); print-color-adjust: exact; -webkit-print-color-adjust: exact; }
.selo.protocolado { border-color: var(--serie-canal-forte); color: var(--serie-canal-forte); }
.selo.decidido { border-color: var(--serie-canal-forte); }
.selo.arquivado { border-color: var(--borda-sutil); color: var(--texto-apoio); }

/* ---------- marcas de origem ---------- */

.marca-origem {
  display: inline-flex; align-items: center; gap: var(--esp-1);
  font-family: var(--fonte-titulo); font-weight: var(--peso-medio); font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--texto-apoio);
  white-space: nowrap;
}
.marca-origem .pictograma { width: 10px; height: 10px; flex: 0 0 10px; border-radius: 0; }
.marca-origem.medido .pictograma { background: var(--serie-canal-forte); }
.marca-origem.publicado .pictograma { background: var(--texto-forte); }
.marca-origem.premissa .pictograma { background: var(--hachura-sem-canal); border: var(--borda-1) solid var(--serie-sem-canal); }
.marca-origem.estimado .pictograma { border: var(--contorno-derivado); }
.marca-origem.sintetico .pictograma { background: var(--hachura-lacuna); border: var(--borda-1) solid var(--serie-sem-canal); }
.marca-origem { print-color-adjust: exact; -webkit-print-color-adjust: exact; }

/* ---------- chip de razao, com o codigo literal sempre ao lado da cor ---------- */

.chip {
  display: inline-flex; align-items: center; gap: var(--esp-2);
  font-family: var(--fonte-titulo); font-weight: var(--peso-medio); font-size: 12px;
  letter-spacing: 0.04em; color: var(--texto-forte);
  border-radius: var(--raio-1); padding: var(--esp-1) var(--esp-3);
  border: var(--borda-1) solid var(--borda-sutil);
}
.chip .amostra { width: 12px; height: 12px; flex: 0 0 12px; }
.chip.rel .amostra { background: var(--serie-canal-forte); }
.chip.cnf .amostra { background: var(--serie-canal-fraco); }
.chip.ene .amostra { background: var(--hachura-sem-canal); border: var(--borda-1) solid var(--serie-sem-canal); }
.chip.par .amostra { border: var(--contorno-derivado); }
.chip.lacuna .amostra { background: var(--hachura-lacuna); border: var(--borda-1) solid var(--serie-sem-canal); }
.chip .amostra { print-color-adjust: exact; -webkit-print-color-adjust: exact; }

/* ---------- barra de rampa: dois canais independentes ---------- */

.rampa { display: flex; height: 22px; border-radius: 0; overflow: hidden; border: var(--borda-1) solid var(--borda-sutil); }
.rampa .segmento { position: relative; }
.rampa .segmento + .segmento { border-left: var(--borda-1) solid var(--superficie-elevada); }
.rampa .rel { background: var(--serie-canal-forte); }
.rampa .cnf { background: var(--serie-canal-fraco); }
.rampa .ene { background: var(--hachura-sem-canal); }
.rampa .par { background: transparent; border-top: var(--contorno-derivado); border-bottom: var(--contorno-derivado); }
.rampa .lacuna { background: var(--hachura-lacuna); }
.rampa .segmento { print-color-adjust: exact; -webkit-print-color-adjust: exact; }

.legenda { display: flex; flex-wrap: wrap; gap: var(--esp-4); margin-top: var(--esp-3); }

/* ---------- dossie: indice lateral e documento ---------- */

.dossie { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: var(--esp-7); align-items: start; }

.indice-lateral { position: sticky; top: calc(var(--altura-topo) + var(--esp-5)); }
.indice-lateral ol { list-style: none; margin: 0; padding: 0; counter-reset: cap; }
.indice-lateral li { counter-increment: cap; }
.indice-lateral a {

  font-size: 14px; line-height: 1.45;
}
.indice-lateral a::before { content: counter(cap); font-family: var(--fonte-titulo); font-weight: var(--peso-medio); font-size: 12px; color: var(--texto-apoio); }
.indice-lateral a:hover { color: var(--texto-forte); }
.indice-lateral a[aria-current] { color: var(--texto-forte); border-left-color: var(--serie-canal-forte); font-weight: var(--peso-medio); }
.indice-lateral .rotulo { padding: var(--esp-2) var(--esp-3); }

.documento { min-width: 0; }

.cabecalho-documento {

  margin-bottom: var(--esp-6);

.cabecalho-documento .grade { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--esp-4); margin-top: var(--esp-4); }
.cabecalho-documento .campo .valor { font-weight: var(--peso-medio); color: var(--texto-forte); text-wrap: balance; }

.capitulo { margin-bottom: var(--esp-7); scroll-margin-top: calc(var(--altura-topo) + var(--esp-4)); }
.capitulo > .rotulo { display: block; margin-bottom: var(--esp-2); }
.capitulo h2 { margin-bottom: var(--esp-4); }
.capitulo h3 { margin: var(--esp-5) 0 var(--esp-3); }
.capitulo p + h3 { margin-top: var(--esp-5); }

/* resumo de cinco linhas */
.resumo { background: var(--superficie-elevada); border: var(--borda-1) solid var(--borda-sutil); border-left: var(--borda-3) solid var(--texto-forte); border-radius: var(--raio-2); padding: var(--esp-4) var(--esp-5); }
.resumo ol { margin: 0; padding-left: var(--esp-5); max-width: var(--largura-leitura); }
.resumo li { margin-bottom: var(--esp-2); }

.cartao { background: var(--superficie-elevada); border: var(--borda-1) solid var(--borda-sutil); border-radius: var(--raio-2); padding: var(--esp-4); box-shadow: var(--sombra-1); }
.grade-cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--esp-4); }

.linha-decisao { display: flex; align-items: baseline; gap: var(--esp-3); flex-wrap: wrap; }

.caixa-nao-acionavel { background: var(--superficie-trilho); border-left: var(--borda-3) solid var(--serie-sem-canal); border-radius: var(--raio-2); padding: var(--esp-4); }
.caixa-nao-acionavel p { max-width: var(--largura-leitura); }

.tabela-patamares { font-size: 14px; line-height: 1.45; }
.tabela-patamares td { font-variant-numeric: tabular-nums; }

/* ---------- painel do porque ---------- */

.veu { position: fixed; inset: 0; background: rgba(16, 21, 26, 0.42); z-index: var(--z-veu); display: none; }
.veu.aberto { display: block; }

.painel-porque {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 92vw);
  background: var(--superficie-elevada); border-left: var(--borda-1) solid var(--borda-forte);
  box-shadow: var(--sombra-2); z-index: var(--z-painel);
  padding: var(--esp-5); overflow-y: auto; display: none;
}
.painel-porque.aberto { display: block; }
.painel-porque h3 { margin-bottom: var(--esp-2); }
.painel-porque .fechar { position: absolute; top: var(--esp-4); right: var(--esp-4); background: none; border: 0; font-size: 20px; line-height: 1; cursor: pointer; color: var(--texto-apoio); }
.painel-porque dl { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: var(--esp-2) var(--esp-3); margin: var(--esp-4) 0 0; }
.painel-porque dt { font-family: var(--fonte-titulo); font-weight: var(--peso-medio); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--texto-apoio); }
.painel-porque dd { margin: 0; font-size: 14px; line-height: 1.45; }
.painel-porque .consulta { background: var(--superficie-trilho); border-radius: var(--raio-2); padding: var(--esp-3); font-size: 12px; overflow-x: auto; margin-top: var(--esp-3); white-space: pre-wrap; word-break: break-word; }

/* ---------- grafico de perfil por hora ---------- */

/* O grafico empilha o que de fato soma: o publicado e o que a usina mediu ALÉM dele.

.perfil .hora { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }

.perfil .seg-divergencia { background: var(--serie-canal-forte); }

.sumario { display: none; }

.sumario li { margin-bottom: var(--esp-1); }
.sumario a { color: var(--texto-corrente); text-decoration: none; }

  @page { size: A4 portrait; margin: 16mm 14mm 18mm; }

  * { background-color: transparent; box-shadow: none !important; }
  .topo, .indice-lateral, .veu, .painel-porque { display: none !important; }
  .conteudo { padding: 0; }
  .dossie { display: block; }
  .sumario { display: block; }

  .hachura-sem-canal, .hachura-lacuna, .marca-origem, .linha-acionavel,
  .faixa-sintetica, .chip .amostra, .rampa .segmento, .selo.consistencia,
  .perfil .seg-publicado, .perfil .seg-divergencia, .escala {
    print-color-adjust: exact; -webkit-print-color-adjust: exact;
  }

  thead { display: table-header-group; }
  tfoot { display: table-footer-group; }
  tr, .cartao, .linha-decisao, .no { break-inside: avoid; }
  .capitulo { break-before: page; }
  h1, h2, h3 { break-after: avoid; }
  p, li { orphans: 3; widows: 3; }

  .cabecalho-documento { position: fixed; top: 0; left: 0; right: 0; }
  .faixa-versao { position: fixed; bottom: 0; left: 0; right: 0; background: transparent; color: #555555; }
  body { padding-top: 14mm; padding-bottom: 12mm; }

  .selo.atencao { background: transparent !important; border: var(--borda-1) solid #6b6b6b; color: #1a1a1a !important; }
  .botao, .cabecalho-tela .acao { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}

@media (max-width: 900px) {
  .dossie { grid-template-columns: minmax(0, 1fr); }
  .indice-lateral { position: static; }
  .cabecalho-documento .grade { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

const prazo = (dias, data) => dias == null

  : `<span class="selo atencao">${dias} dia${dias === 1 ? "" : "s"} úteis</span> <span class="nota">${data}</span>`;

/* ---------- estado e roteamento ---------- */

let TELA = "casos";
let CAPITULO = "capa";

function irPara(tela, capitulo) {
  TELA = tela;
  if (capitulo) CAPITULO = capitulo;
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

/* ---------- casca ---------- */

function renderCasca() {
  const u = FIXTURE.usina;
  document.getElementById("contexto-topo").textContent = TELA === "dossie" ? `${u.nome} · ${u.conjunto.nome} · dossiê v3` : "";

  const abas = [["casos", "Casos"], ["dossie", "Dossiê"], ["conectar", "Conectar usina"], ["fontes", "Fontes"]];
  document.getElementById("nav-topo").innerHTML = abas.map(([id, nome]) =>
    `<button data-tela="${id}" ${TELA === id ? 'aria-current="page"' : ""}>${nome}</button>`).join("");

  const m = FIXTURE.meta;
  document.getElementById("faixa-versao").innerHTML = TELA === "dossie"
    ? `<span>dossiê v3</span><span class="separador">·</span><span>dado v3</span><span class="separador">·</span><span>janela de ${FIXTURE.janela.inicio} a ${FIXTURE.janela.fim}</span><span class="separador">·</span><span>${FIXTURE.janela.patamares.toLocaleString("pt-BR")} patamares</span><span class="separador">·</span><span>gerado em ${m.gerado}</span><span class="cresce"></span><span>protótipo v2</span>`
    : `<span>${m.aviso}</span>`;
}

/* ---------- tela: casos ---------- */

function telaCasos() {
  // a regra da tela, implementada: ordena pelo prazo que vence, e o caso sem prazo vai para o fim
  const casos = [...FIXTURE.casos].sort((a, b) => {
    const pa = a.prazoDias == null ? Infinity : a.prazoDias;
    const pb = b.prazoDias == null ? Infinity : b.prazoDias;
    return pa - pb;
  });
  const linhas = casos.map((c) => `
    <tr class="${c.prazoDias != null && c.prazoDias <= 5 ? "selecionado" : ""}" data-abrir="1">
      <td>
        <div class="forte">${c.usina}</div>
        <div class="nota">${c.ons} · conjunto ${c.conjunto}</div>
      </td>
      <td class="compacto">${c.ciclo}<div class="nota">${c.janela}</div></td>
      <td>${seloEstado(c.estado)}</td>
      <td>${prazo(c.prazoDias, c.prazoData)}</td>
      <td class="direita">${c.risco == null ? '<span class="nota">a apurar</span>' : `<span class="forte">${brlMil(c.risco)}</span>`}</td>
      <td class="direita compacto">${c.versao == null ? '<span class="nota">não se aplica</span>' : "v" + c.versao}<div class="nota">${c.gerado || ""}</div></td>
    </tr>`).join("");

  return `
    <div class="cabecalho-tela">
      <div>
        <h1>Casos</h1>
        <p class="nota">Ordenados pelo prazo que vence, e não pela data de criação. Um caso sem prazo vencendo vai para o fim, mesmo que seja o mais caro.</p>
      </div>
      <div class="acao"><button class="botao" data-tela="conectar">Conectar usina</button></div>
    </div>
    <table class="tabela">
      <caption class="rotulo">Dossiês por caso de apuração</caption>
      <thead><tr>
        <th>Usina</th><th>Ciclo de apuração</th><th>Estado</th><th>Prazo que vence</th>
        <th class="direita">Valor em risco</th><th class="direita">Versão</th>
      </tr></thead>
      <tbody>${linhas}</tbody>
    </table>
    <p class="nota" style="margin-top:var(--esp-4)">Três casos: o ciclo aberto da Delta 3 I, o ciclo anterior arquivado, e uma usina do conjunto ainda não conectada. O valor em risco é estimativa ao preço declarado de R$ 250 por MWh.</p>`;
}

/* ---------- tela: dossiê ---------- */

const CAPITULOS = [
  ["capa", "Capa e resumo"],
  ["divergencia", "A divergência"],
  ["prova", "A prova"],
  ["decisao", "A decisão"],
  ["operacao", "A operação"],
  ["premissas", "Premissas e limitações"],
  ["versoes", "Versões"],
];

function indice() {
  return `<nav class="indice-lateral" aria-label="Capítulos do dossiê">
    <div class="rotulo">Capítulos</div>

}

function sumario() {
  // o indice lateral nao imprime: no papel ele vira sumario na primeira pagina
  return `<nav class="sumario" aria-label="Sumário do dossiê">
    <div class="rotulo">Sumário</div>
    <ol>${CAPITULOS.map(([id, nome]) => `<li><a href="#${id}">${nome}</a></li>`).join("")}</ol>
  </nav>`;
}

function cabecalhoDocumento() {
  const u = FIXTURE.usina, j = FIXTURE.janela;
  return `<header class="cabecalho-documento">
    <div class="identidade">
      <h1>Dossiê de apuração de curtailment</h1>
      <span class="selo protocolado">v3</span>
      <span class="nota">gerado em ${FIXTURE.meta.gerado}</span>
    </div>
    <div class="grade">
      <div class="campo"><div class="rotulo">Usina</div><div class="valor">${u.nome}</div><div class="nota">identificador ${u.id}, ${num(u.potenciaMW, 1)} MW</div></div>
      <div class="campo"><div class="rotulo">Conjunto</div><div class="valor">${u.conjunto.nome}</div><div class="nota">${u.conjunto.usinas} usinas, ${num(u.conjunto.potenciaMW, 0)} MW</div></div>
      <div class="campo"><div class="rotulo">Janela de apuração</div><div class="valor">${j.inicio} a&nbsp;${j.fim}</div><div class="nota">${j.patamares.toLocaleString("pt-BR")} patamares, ${num(j.anos, 3)} anos</div></div>

}

function faixaSintetica() {
  return `<div class="faixa-sintetica">
    <span class="marca-origem sintetico" style="flex:0 0 auto"><span class="pictograma"></span>sintético</span>
    <div class="texto">${FIXTURE.meta.rotuloSintetico}. A coluna medida deste dossiê é série gerada por script, com semente fixa, calibrada nos agregados publicados da mesma janela. O gerador e os parâmetros estão no repositório.</div>
  </div>`;
}

function capaResumo() {
  const a = FIXTURE.agregados, d = FIXTURE.divergencia, u = FIXTURE.usina;
  const totalPublicado = a.publicado.reduce((s, r) => s + r.reais, 0);
  return `<section class="capitulo" id="capa">
    <span class="rotulo">Capítulo 1</span>
    <h2>Capa e resumo</h2>
    <div class="resumo">
      <ol>
        <li>A usina perdeu <span class="forte">${num((a.publicado[0].mwh + a.publicado[1].mwh + a.publicado[2].mwh) / 1000, 3)} GWh</span> por corte na janela do Termo, dos quais ${pct(a.reconciliacao.restritosPct)} dos patamares têm geração restrita ${marca("publicado", "ene", "publicado")}.</li>
        <li>O que está em risco são <span class="forte">${brlMi(totalPublicado)}</span> publicados ${marca("publicado", "ene", "publicado")} mais <span class="forte">${brlMil(d.reais)}</span> que o operador não publicou e a usina mediu ${marca("sintetico", "divergencia", "sintético")}.</li>
        <li>Dos ${num((a.publicado[0].mwh + a.publicado[1].mwh + a.publicado[2].mwh) / 1000, 3)} GWh, ${pct(a.publicado[0].mwh / (a.publicado[0].mwh + a.publicado[1].mwh + a.publicado[2].mwh) * 100, 0)} são razão energética, e razão energética <span class="forte">não tem canal de reclamação</span> ${marca("publicado", "ene", "publicado")}.</li>
        <li>Vence em <span class="forte">3 dias úteis</span>, em 29/09/2026, o prazo do ciclo de apuração ${marca("publicado", "franquia", "premissa")}.</li>
        <li>A conclusão muda se o jurídico atribuir mais de <span class="forte">4%</span> de chance de êxito sobre a razão energética ${marca("estimado", "indiferenca", "estimado")}.</li>
      </ol>
    </div>

    <h3>Os números do capítulo</h3>
    <div class="grade-cartoes">
      <div class="cartao">
        <div class="rotulo">Valor em risco na janela</div>
        <div class="numero">${brlMi(totalPublicado + d.reais)}</div>
        <div class="nota">publicado mais a divergência, ao preço declarado ${marca("premissa", "pld", "premissa")}</div>
      </div>
      <div class="cartao">
        <div class="rotulo">A divergência</div>
        <div class="numero">${brlMil(d.reais)}</div>
        <div class="nota">${d.patamares.toLocaleString("pt-BR")} patamares, ${num(d.mwh, 1)} MWh ${marca("sintetico", "divergencia", "sintético")}</div>
      </div>
      <div class="cartao">
        <div class="rotulo">Faixa de sensibilidade</div>
        <div class="numero" style="font-size:22px">${brlMil(d.faixa[0])} a ${brlMil(d.faixa[1])}</div>
        <div class="nota">de R$ 150 a R$ 400 por MWh ${marca("premissa", "pld", "premissa")}</div>
      </div>
    </div>

    <h3>O que a usina perdeu, por razão</h3>
    <div class="rampa">
      ${(() => {
        const tot = a.publicado.reduce((s, r) => s + r.mwh, 0);
        return a.publicado.map((r) => `<div class="segmento ${r.razao.toLowerCase()}" style="width:${(r.mwh / tot * 100).toFixed(2)}%"></div>`).join("");
      })()}
      <div class="segmento lacuna" style="width:4%"></div>
    </div>
    <div class="legenda">
      ${a.publicado.map((r) => `<span class="chip ${r.razao.toLowerCase()}"><span class="amostra"></span>${r.razao} · ${num(r.mwh / 1000, 3)} GWh · ${brlMi(r.reais)}</span>`).join("")}
      <span class="chip lacuna"><span class="amostra"></span>não caracterizada · ${num(d.mwh / 1000, 3)} GWh</span>
    </div>
    <p class="nota" style="margin-top:var(--esp-3)">Preenchimento cheio é o que tem canal de reclamação, hachurado é o que não tem, contornado é o que não está na base. A cor é reforço, e a palavra ao lado é que carrega a informação.</p>
  </section>`;
}

function capituloDivergencia() {
  const d = FIXTURE.divergencia, a = FIXTURE.agregados;
  const maxPerfil = Math.max(...FIXTURE.perfilHora.map((p) => p.medido));
  const linhas = d.amostra.map((p) => {
    const cls = p.temDivergencia ? "linha-acionavel" : (p.razao == null ? "linha-sem-canal" : "");
    return `<tr class="${cls}">
      <td class="compacto celula-patamar">${p.patamar}</td>
      <td>${chip(p.razao)}</td>
      <td class="direita">${num(p.publicado)} ${marca("publicado", "ene", "")}</td>
      <td class="direita">${num(p.medido)} ${marca("sintetico", "divergencia", "")}</td>
      <td class="direita forte">${num(p.deltaMwh)}</td>
      <td class="direita">${p.deltaReais ? brl(p.deltaReais) : "0"}</td>
    </tr>`;
  }).join("");

  return `<section class="capitulo" id="divergencia">
    <span class="rotulo">Capítulo 2</span>
    <h2>A divergência</h2>
    <p>É o motivo de o produto existir. O operador publica, por patamar, o corte de cada usina; a usina mede a própria geração. Onde o operador publicou zero e a usina mediu corte, existe uma diferença que ninguém apura, e é ela que vira pedido.</p>

    <h3>Perfil por hora do dia</h3>
    <div class="perfil-topo">
      <span class="rotulo">MWh por hora do dia, somados na janela</span>
      <span class="separador" style="color:var(--texto-apoio)">·</span>
      <span class="nota">o topo de cada barra é o medido, e o máximo é ${num(maxPerfil, 1)} MWh</span>
    </div>
    <div class="grafico">
      <div class="escala"><span>${num(maxPerfil, 1)}</span><span>${num(maxPerfil / 2, 1)}</span><span>0</span></div>
      <div class="perfil">
      ${FIXTURE.perfilHora.map((p) => {
        const lacuna = Math.max(0, p.medido - p.publicado);
        return `<div class="hora" title="${p.hora} · publicado ${num(p.publicado, 1)} MWh · medido ${num(p.medido, 1)} MWh · além do publicado ${num(lacuna, 1)} MWh">
          <div class="seg-divergencia" style="height:${(lacuna / maxPerfil * 100).toFixed(1)}%"></div>
          <div class="seg-publicado" style="height:${(p.publicado / maxPerfil * 100).toFixed(1)}%"></div>
        </div>`; }).join("")}
      </div>
    </div>
    <div class="eixo" style="margin-left:calc(56px + var(--esp-3))">${FIXTURE.perfilHora.map((p, i) => `<span class="${i % 3 === 0 ? "" : "vazio"}">${i % 3 === 0 ? p.hora : "·"}</span>`).join("")}</div>
    <div class="legenda">
      <span class="marca-origem publicado"><span class="pictograma"></span>publicado pelo operador</span>
      <span class="marca-origem medido"><span class="pictograma"></span>medido pela usina além do publicado, série sintética</span>
    </div>
    <p class="nota">O gráfico empilha o que soma: a base é o publicado, o topo em esmeralda é o que a usina mediu além dele, e o total da barra é o medido. A divergência aparece como o topo em todas as horas, e é maior onde o vento é mais forte.</p>

    <h3>A lista que sustenta o pedido</h3>
    <table class="tabela tabela-patamares">
      <caption class="rotulo">Patamares, com a coluna de procedência</caption>
      <thead><tr>
        <th>Patamar</th><th>Razão publicada</th><th class="direita">Publicado (MWh)</th><th class="direita">Medido (MWh)</th>
        <th class="direita">Diferença (MWh)</th><th class="direita">Diferença (R$)</th>
      </tr></thead>
      <tbody>${linhas}</tbody>
    </table>
    <p class="nota" style="margin-top:var(--esp-3)">Mostrando ${d.amostra.length} de ${d.totalAmostra.toLocaleString("pt-BR")} patamares. A lista completa é paginada e exportável, e é ela que vira anexo do pedido. A régua esmeralda à esquerda marca a linha em que há divergência, ou seja, em que há porta: nesta amostra são ${d.amostra.filter((x) => x.temDivergencia).length} das ${d.amostra.length}.</p>

    <h3>O que isso soma</h3>
    <div class="grade-cartoes">
      <div class="cartao"><div class="rotulo">Patamares com divergência</div><div class="numero">${d.patamares.toLocaleString("pt-BR")}</div><div class="nota">${pct(d.pctDosPatamares, 2)} dos ${d.totalAmostra.toLocaleString("pt-BR")} ${marca("sintetico", "divergencia", "sintético")}</div></div>
      <div class="cartao"><div class="rotulo">Energia não publicada</div><div class="numero">${num(d.mwh, 1)} <span style="font-size:16px">MWh</span></div><div class="nota">corte médio de ${num(d.corteMedioMwh)} MWh por patamar</div></div>
      <div class="cartao"><div class="rotulo">Valor ao preço declarado</div><div class="numero">${brlMil(d.reais)}</div><div class="nota">a R$ ${num(d.pld, 0)} por MWh, faixa de ${brlMil(d.faixa[0])} a ${brlMil(d.faixa[1])} ${marca("premissa", "pld", "premissa")}</div></div>
    </div>
    <p class="nota" style="margin-top:var(--esp-3)">A base publicada registra ${a.reconciliacao.ventoInvalidoPatamares.toLocaleString("pt-BR")} patamares com vento inválido, ${pct(a.reconciliacao.ventoInvalidoPct)} do total, e ${a.reconciliacao.restritosPatamares.toLocaleString("pt-BR")} com geração restrita. Enquanto o vento inválido não for resolvido, a referência da usina pode estar zerada e o valor pleiteável, subestimado.</p>
  </section>`;
}

function capituloProva() {
  const linhas = FIXTURE.prova.map((p) => {
    const atencao = p.estado === "atencao";
    const cls = p.estado === "resolver" || p.estado === "pendente" ? "linha-acionavel" : "linha-sem-canal";
    return `<tr class="${cls}">
      <td><div class="forte">${p.evento}</div><div class="nota">${p.dado}</div></td>
      <td class="compacto">${p.regra}</td>
      <td class="compacto">${p.norma}</td>
      <td class="compacto">${atencao ? `<span class="selo atencao">${p.prazo}</span>` : p.prazo}</td>
      <td>${p.estado === "recebido" ? '<span class="selo decidido">recebido</span>' : p.estado === "apurado" ? '<span class="selo protocolado">apurado</span>' : p.estado === "atencao" ? '<span class="selo atencao">vence</span>' : `<span class="selo consistencia">${p.estado}</span>`}</td>
    </tr>`;
  }).join("");

  return `<section class="capitulo" id="prova">
    <span class="rotulo">Capítulo 3</span>
    <h2>A prova</h2>
    <p>O que a usina alega, com que regra, e até quando. Cada linha é um evento datado, e a régua lateral diz quais ainda têm porta aberta.</p>
    <table class="tabela">
      <caption class="rotulo">Trilha de prova do ciclo</caption>
      <thead><tr><th>Evento e dado</th><th>Regra</th><th>Norma</th><th>Prazo</th><th>Estado</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>
    <div class="caixa-nao-acionavel" style="margin-top:var(--esp-5)">
      <div class="rotulo">O que não é acionável</div>
      <p>Os ${pct(FIXTURE.decisao.eneShare * 100, 0)} de razão energética não entram em pedido de substituição. O produto mostra o valor, marca que não há canal, e não sugere caminho. Não é parecer jurídico e não afirma conformidade.</p>
    </div>
  </section>`;
}

function capituloDecisao() {
  const d = FIXTURE.decisao;
  const linhas = d.cenarios.map((c, i) => `<tr class="${i === 0 ? "linha-acionavel" : "linha-sem-canal"}">
      <td><div class="forte">${c.nome}</div><div class="nota">${c.canal}</div></td>
      <td class="direita forte">${brlMil(c.vp)}</td>
      <td class="direita">${c.renuncia ? brlMi(c.renuncia) : "nada"}</td>

  const sens = d.sensibilidade.map((s) => `<tr><td>R$ ${num(s.pld, 0)}/MWh</td><td class="direita forte">${brlMil(s.valor)}</td></tr>`).join("");

  return `<section class="capitulo" id="decisao">
    <span class="rotulo">Capítulo 4</span>
    <h2>A decisão</h2>
    <p>Aderir ao Termo de Compromisso soma pouco e fecha a porta do muito. Este capítulo põe os três caminhos lado a lado e diz onde a conclusão vira.</p>

    <table class="tabela">
      <caption class="rotulo">Três caminhos, valor presente ao preço declarado</caption>
      <thead><tr><th>Caminho</th><th class="direita">Valor presente</th><th class="direita">Renúncia</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>

    <h3>O que decide</h3>
    <div class="grade-cartoes">
      <div class="cartao"><div class="rotulo">Adesão, valor presente</div><div class="numero">${brlMil(d.adesao)}</div><div class="nota">valor presente ${marca("estimado", "adesao", "estimado")}</div></div>
      <div class="cartao"><div class="rotulo">Renúncia irreversível</div><div class="numero">${brlMi(d.renuncia)}</div><div class="nota">renúncia irreversível ${marca("estimado", "renuncia", "estimado")}</div></div>
      <div class="cartao"><div class="rotulo">Ponto de indiferença</div><div class="numero">${pct(d.indiferenca * 100, 0)}</div><div class="nota">de chance de êxito sobre a razão energética ${marca("estimado", "indiferenca", "estimado")}</div></div>
    </div>

    <h3>Sensibilidade ao preço</h3>
    <table class="tabela" style="max-width:420px">
      <thead><tr><th>Preço da energia</th><th class="direita">Adesão</th></tr></thead>
      <tbody>${sens}</tbody>
    </table>
    <p class="nota" style="margin-top:var(--esp-3)">A distância entre a adesão e a renúncia é o produto. O cliente não precisa de um número certo; precisa ver que a renúncia é uma ordem de grandeza maior.</p>

    <h3>Recomendação, com a fronteira dela</h3>
    <div class="cartao" style="border-left:var(--borda-3) solid var(--serie-canal-forte)">
      <div class="linha-decisao"><span class="forte" style="font-size:16px">${d.recomendacao}</span></div>
      <p style="margin-top:var(--esp-2)">A fronteira: a recomendação ${d.fronteira} ${marca("estimado", "indiferenca", "estimado")}.</p>
    </div>
  </section>`;
}

function capituloOperacao() {
  const j = FIXTURE.manutencao, b = FIXTURE.bateria;
  const linhas = j.ranking.map((w, i) => `<tr class="${i === 0 ? "linha-acionavel" : "linha-sem-canal"}">
      <td class="compacto">${w.inicio}</td><td>${w.horas} h</td>
      <td class="direita">${num(w.mwh, 0)}</td>
      <td class="direita forte">${brl(w.reais)}</td>
      <td class="compacto">${w.risco}</td>
    </tr>`).join("");

  return `<section class="capitulo" id="operacao">
    <span class="rotulo">Capítulo 5</span>
    <h2>A operação</h2>
    <p>A parcela que não tem canal de pleito se recupera na operação. São duas alavancas: escolher a janela da manutenção e testar se a bateria se paga.</p>

    <h3>A janela de manutenção</h3>
    <p>${j.patamaresCandidatos} janelas de 72 h candidatas na janela do Termo, ordenadas pelo ganho. O valor é <span class="forte">teto de previsão perfeita</span>: supõe acertar o corte, e por isso vem rotulado ${marca("estimado", "janela", "estimado")}.</p>
    <table class="tabela">
      <caption class="rotulo">As quatro melhores janelas</caption>
      <thead><tr><th>Início</th><th>Duração</th><th class="direita">Energia</th><th class="direita">Ganho</th><th>Risco</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>
    <p class="nota" style="margin-top:var(--esp-3)">A melhor janela vale ${brl(j.melhor.reais)}, contra uma mediana de ${brl(j.mediana.reais)}: escolher a janela errada custa mais de dez vezes o ganho.</p>

    <h3>A bateria</h3>
    <div class="cartao" style="border-left:var(--borda-3) solid var(--serie-sem-canal)">
      <div class="linha-decisao">
        <span class="selo consistencia">veredito</span>
        <span class="forte" style="font-size:16px">A bateria não fecha na janela atual</span>
      </div>
      <p style="margin-top:var(--esp-2)">${b.razao}. O ponto de indiferença é ${brl(b.indiferenca)} por MWh ${marca("estimado", "bateria", "estimado")}, contra um preço de liquidação realizado entre ${brl(b.pldPiso)} e ${brl(b.pldTeto)} por MWh.</p>
      <p><span class="rotulo">O que faria fechar</span><br>${b.mudaria}</p>
    </div>
  </section>`;
}

function capituloPremissas() {
  const linhas = FIXTURE.premissas.map((p) => `<tr class="${p.marca === "sintetico" ? "linha-sem-canal" : p.marca === "premissa" ? "" : "linha-acionavel"}">
      <td><div class="forte">${p.nome}</div><div class="nota">${p.origem}</div></td>
      <td>${p.valor}</td>
      <td class="compacto">${p.faixa}</td>
      <td class="compacto">${p.data}</td>
      <td>${marca(p.marca, p.marca === "sintetico" ? "divergencia" : p.marca === "publicado" ? "ene" : "pld", p.marca)}</td>
    </tr>`).join("");

  return `<section class="capitulo" id="premissas">
    <span class="rotulo">Capítulo 6</span>
    <h2>Premissas e limitações</h2>
    <p>Todo número que não é medição nem publicação está aqui, com o valor, a faixa e a data em que foi declarado. É o que permite a outro leitor refazer a conta.</p>
    <table class="tabela">
      <caption class="rotulo">Premissas vigentes do dossiê v3</caption>
      <thead><tr><th>Premissa</th><th>Valor</th><th>Faixa</th><th>Declarada em</th><th>Marca</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>

    <h3>Limitações declaradas</h3>
    <div class="caixa-nao-acionavel">
      <ol style="margin:0;padding-left:var(--esp-5)">
        <li>A coluna medida é série sintética, calibrada na base pública, e não medição da usina. O conector real do cliente entra depois do pitch, como upsell.</li>
        <li>O rateio por usina dentro do conjunto segue a capacidade instalada, pelo item 5.2.2.11 da RO-AO.BR.13. A divergência com a mediana de 30 dias segue aberta e vai ao mentor do operador.</li>
        <li>O preço da energia é premissa declarada, e não preço observado. Toda conta em reais carrega a faixa de R$ 150 a R$ 400 por MWh.</li>
        <li>O produto não emite parecer jurídico e não afirma conformidade regulatória. Ele apura e documenta.</li>
      </ol>
    </div>
  </section>`;
}

function capituloVersoes() {
  const v = FIXTURE.versoes, d = FIXTURE.diff;
  const linhas = v.map((x, i) => `<tr class="${i === 0 ? "linha-acionavel" : "linha-sem-canal"}">
      <td class="forte">v${x.versao}</td><td class="compacto">${x.gerado}</td>
      <td class="compacto">${x.mudanca}</td>
      <td class="nota">${x.hash}</td>
    </tr>`).join("");

  return `<section class="capitulo" id="versoes">
    <span class="rotulo">Capítulo 7</span>
    <h2>Versões</h2>
    <p>O dossiê é versionado, e cada versão é congelada com hash e data. Quem lê a versão 3 precisa saber o que mudou desde a 2 sem abrir as duas.</p>
    <table class="tabela">
      <caption class="rotulo">Histórico do dossiê</caption>
      <thead><tr><th>Versão</th><th>Gerado em</th><th>O que mudou</th><th>Hash</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>

    <h3>O que mudou da versão 2 para a 3</h3>
    <div class="diff">
      <div class="antes">
        <div class="rotulo">Versão 2</div>
        ${d.antes.map((x) => `<div style="margin-top:var(--esp-2)"><div class="nota">${x.campo}</div><div>${x.valor}</div></div>`).join("")}
      </div>
      <div class="depois">
        <div class="rotulo">Versão 3</div>
        ${d.depois.map((x) => `<div style="margin-top:var(--esp-2)"><div class="nota">${x.campo}</div><div class="forte">${x.valor}</div></div>`).join("")}
      </div>
    </div>
    <p class="nota" style="margin-top:var(--esp-4)">A assinatura é por veredito, e não por documento: cada linha da lista de patamares carrega o próprio caminho de origem, de forma que alterar um registro de origem quebra a rastreabilidade daquela linha, e não apenas a do relatório.</p>
  </section>`;
}

function telaDossie() {
  const capitulos = {
    capa: capaResumo, divergencia: capituloDivergencia, prova: capituloProva,
    decisao: capituloDecisao, operacao: capituloOperacao, premissas: capituloPremissas, versoes: capituloVersoes,
  };
  return `<div class="dossie">${indice()}<div class="documento">${cabecalhoDocumento()}${sumario()}${faixaSintetica()}${CAPITULOS.map(([id]) => capitulos[id]()).join("")}</div></div>`;
}

/* ---------- telas fora do documento ---------- */

function telaConectar() {
  return `<div class="cabecalho-tela"><div><h1>Conectar a usina</h1>
    <p class="nota">É onde o cliente vê que o produto lê a base pública e o que ele espera da usina. Fora do documento, e só duas telas ficam fora dele.</p></div></div>
    <div class="grade-cartoes">
      <div class="cartao"><div class="rotulo">Passo 1</div><h3>Identificar a usina no cadastro do operador</h3><p class="compacto">Pelo identificador MAEDT1 e pelo conjunto Paulino Neves. O produto confere a capacidade instalada e a data de entrada em operação.</p><div class="nota">${marca("publicado", "ene", "cadastro do operador")}</div></div>
      <div class="cartao"><div class="rotulo">Passo 2</div><h3>Ligar as fontes de dado</h3><p class="compacto">A base pública de detalhamento por usina e o cadastro de capacidade. A leitura roda uma vez por dia, depois das 15h, quando o operador publica o dia anterior.</p><div class="nota">${marca("publicado", "ene", "base pública")}</div></div>
      <div class="cartao"><div class="rotulo">Passo 3</div><h3>Declarar as premissas</h3><p class="compacto">Preço da energia, franquia anual de horas e taxa de recuperação. O produto não pode saber isso sozinho, e cada valor fica datado no dossiê.</p><div class="nota">${marca("premissa", "pld", "premissa")}</div></div>
      <div class="cartao"><div class="rotulo">Passo 4</div><h3>Ligar a medição da usina</h3><p class="compacto">O conector de SCADA do cliente. Enquanto ele não existe, a demonstração roda a série sintética calibrada na base pública, sob rótulo.</p><div class="nota">${marca("sintetico", "divergencia", "sintético")}</div></div>
    </div>`;
}

function telaFontes() {
  const fontes = [
    ["Base de detalhamento por usina", "restricao_coff_eolica_detail_tm", "23/09/2026 15:04", "ok", "39.216 patamares na janela"],
    ["Base de conjunto por razão", "restricao_coff_eolica_tm", "23/09/2026 15:04", "ok", "usada na alocação"],
    ["Cadastro de capacidade", "capacidade-geracao", "23/09/2026 15:02", "ok", "426 MW no conjunto"],
    ["Medição da usina", "conector de SCADA", "não se aplica", "sintetico", "série sintética, semente 20260924"],
  ];
  const linhas = fontes.map(([nome, id, lido, estado, nota]) => `<tr class="${estado === "sintetico" ? "linha-sem-canal" : "linha-acionavel"}">
      <td><div class="forte">${nome}</div><div class="nota">${id}</div></td>
      <td class="compacto">${lido}</td>
      <td>${estado === "ok" ? '<span class="selo decidido">ok</span>' : '<span class="selo consistencia">sintético</span>'}</td>
      <td class="compacto">${nota}</td>
    </tr>`).join("");

  return `<div class="cabecalho-tela"><div><h1>Fontes e conexões</h1>
    <p class="nota">O estado de cada fonte, com a última leitura. Substitui qualquer tela de administração.</p></div></div>
    <table class="tabela">
      <thead><tr><th>Fonte</th><th>Última leitura</th><th>Estado</th><th>Observação</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>`;
}

/* ---------- painel do porquê ---------- */

function abrirPorque(chave) {
  const p = PORQUE[chave];
  if (!p) return;
  const painel = document.getElementById("painel");
  painel.innerHTML = `
    <button class="fechar" data-fechar="1" aria-label="fechar">×</button>
    <div class="rotulo">O caminho deste número</div>
    <h3>${p.titulo}</h3>
    ${p.aviso ? `<div class="faixa-sintetica" style="margin-top:var(--esp-3)"><span class="marca-origem sintetico"><span class="pictograma"></span>sintético</span><div class="texto">${p.aviso}</div></div>` : ""}
    <dl>
      <dt>Origem</dt><dd>${p.fonte}</dd>
      <dt>Regra</dt><dd>${p.regra}</dd>
      <dt>Data</dt><dd>${p.data}</dd>
      <dt>Versão</dt><dd>${p.versao}</dd>
      <dt>Marca</dt><dd>${marca(p.marca, chave, p.marca)}</dd>
    </dl>
    <div class="rotulo" style="margin-top:var(--esp-5)">Como o número foi obtido</div>
    <div class="consulta">${p.consulta}</div>
    <p class="nota" style="margin-top:var(--esp-4)">Esta é a resposta à pergunta que a banca e o cliente fazem. No produto, o painel abre a consulta executada, o arquivo de origem e a versão do dado.</p>`;
  painel.classList.add("aberto");
  painel.setAttribute("aria-hidden", "false");
  document.getElementById("veu").classList.add("aberto");
}

function fecharPorque() {
  document.getElementById("painel").classList.remove("aberto");
  document.getElementById("painel").setAttribute("aria-hidden", "true");
  document.getElementById("veu").classList.remove("aberto");
}

/* ---------- render e eventos ---------- */

function render() {
  renderCasca();
  const app = document.getElementById("app");
  app.innerHTML = TELA === "casos" ? telaCasos()
    : TELA === "dossie" ? telaDossie()
    : TELA === "conectar" ? telaConectar()
    : telaFontes();
}

/* o indice acompanha a rolagem: o capitulo visivel e o que fica marcado */
function sincronizarIndice() {
  if (TELA !== "dossie") return;
  const alvos = CAPITULOS.map(([id]) => document.getElementById(id)).filter(Boolean);
  let atual = alvos[0];
  for (const el of alvos) { if (el.getBoundingClientRect().top <= 140) atual = el; }
  if (atual && atual.id !== CAPITULO) {
    CAPITULO = atual.id;
    document.querySelectorAll(".indice-lateral a").forEach((a) => {
      if (a.dataset.capitulo === CAPITULO) a.setAttribute("aria-current", "true");
      else a.removeAttribute("aria-current");
    });
  }
}
window.addEventListener("scroll", sincronizarIndice, { passive: true });

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-porque]");
  if (t) { e.preventDefault(); abrirPorque(t.dataset.porque); return; }

  if (e.target.closest("[data-fechar]") || e.target.id === "veu") { fecharPorque(); return; }

  const tela = e.target.closest("[data-tela]");
  if (tela) { irPara(tela.dataset.tela); return; }

  const cap = e.target.closest("[data-capitulo]");
  if (cap) { e.preventDefault(); CAPITULO = cap.dataset.capitulo; render(); document.getElementById(CAPITULO).scrollIntoView(); return; }

  if (e.target.closest("[data-exportar]")) { window.print(); return; }

  const abrir = e.target.closest("[data-abrir]");
  if (abrir) { irPara("dossie", "capa"); return; }
});

document.addEventListener("keydown", (e) => { if (e.key === "Escape") fecharPorque(); });

render();

</script>
</body>
</html>
